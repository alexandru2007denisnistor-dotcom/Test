<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>GlassGym</title>
  <meta name="description" content="Trainingsplan, Übungsvorschläge, Ernährungs-Tracking und Gym-Kalender." />
  <meta name="theme-color" content="#0b0820" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GlassGym" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Echtzeit gerenderter Liquid-Hintergrund -->
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="today-label"></p>
        <h1 id="view-title">Heute</h1>
      </div>
      <button class="icon-btn glass" id="settings-btn" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <section id="view" class="view"></section>
  </main>

  <nav class="tabbar glass" id="tabbar">
    <span class="tab-blob" id="tab-blob"></span>
    <button data-tab="home" class="active"><span class="ti">🏠</span><span class="tl">Heute</span></button>
    <button data-tab="plan"><span class="ti">📋</span><span class="tl">Plan</span></button>
    <button data-tab="exercises"><span class="ti">💪</span><span class="tl">Übungen</span></button>
    <button data-tab="nutrition"><span class="ti">🥗</span><span class="tl">Ernährung</span></button>
    <button data-tab="calendar"><span class="ti">🗓️</span><span class="tl">Kalender</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet glass" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grabber"></div>
    <div class="sheet-content" id="sheet-content"></div>
  </div>

  <div class="toast glass" id="toast"></div>

  <script src="exercises.js"></script>
  <script src="app.js"></script>
</body>
</html>
